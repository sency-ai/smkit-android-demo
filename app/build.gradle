plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

// Sency SDK key. Copy AuthKey.local.properties.example to AuthKey.local.properties (git-ignored)
// and set SMKIT_AUTH_KEY. Also read: `sdk_auth_key` in local.properties, or the SMKIT_AUTH_KEY environment variable.
def authKeyProperties = new Properties()
["local.properties", "AuthKey.local.properties"].each { name ->
    def file = rootProject.file(name)
    if (file.exists()) file.withInputStream { authKeyProperties.load(it) }
}
def sdkAuthKey = (authKeyProperties.getProperty("SMKIT_AUTH_KEY")
        ?: authKeyProperties.getProperty("sdk_auth_key")
        ?: System.getenv("SMKIT_AUTH_KEY")
        ?: "").trim()
if (sdkAuthKey.isEmpty()) {
    logger.warn("No SDK key: create AuthKey.local.properties from AuthKey.local.properties.example.")
}
def sdkAuthKeyLiteral = "\"" + sdkAuthKey.replace("\\", "\\\\").replace("\"", "\\\"") + "\""

def cameraXCompatibilityVersion = "1.1.0"
def cameraXCoreCompatibilityVersion = "1.1.0.1-sency16kb"
def appCompatCompatibilityVersion = "1.4.2"
def coroutinesCompatibilityVersion = "1.5.0"

// Exercise SMKit's published compatibility floor instead of allowing newer
// transitive AndroidX/Lifecycle dependencies to silently upgrade these modules.
configurations.configureEach {
    resolutionStrategy.force(
        "androidx.camera:camera-core:${cameraXCoreCompatibilityVersion}",
        "androidx.camera:camera-camera2:${cameraXCompatibilityVersion}",
        "androidx.camera:camera-lifecycle:${cameraXCompatibilityVersion}",
        "androidx.camera:camera-view:${cameraXCompatibilityVersion}",
        "androidx.appcompat:appcompat:${appCompatCompatibilityVersion}",
        "androidx.appcompat:appcompat-resources:${appCompatCompatibilityVersion}",
        "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutinesCompatibilityVersion}",
        "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutinesCompatibilityVersion}",
        "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutinesCompatibilityVersion}",
    )
}

android {
    namespace 'com.example.smkitdemoapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.smkitdemoapp"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.9.9"

        buildConfigField "String", "sdk_auth_key", sdkAuthKeyLiteral

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    implementation "com.sency.smkit:smkit:1.9.9"
    // SMKit's public API exposes these model types. Keep them on the compile classpath
    // so the demo can call the typed APIs directly instead of using reflection.
    implementation "com.sency.smbase.data:smbase-data:1.9.9"
    implementation "com.sency.smbase.nativeclient:smbase-native-client:1.9.9"

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation 'com.google.code.gson:gson:2.8.9'

    implementation "androidx.camera:camera-core:${cameraXCoreCompatibilityVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXCompatibilityVersion}"
    implementation "androidx.camera:camera-view:${cameraXCompatibilityVersion}"

    implementation "androidx.appcompat:appcompat:${appCompatCompatibilityVersion}"

    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutinesCompatibilityVersion}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutinesCompatibilityVersion}"

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.camera.view
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
