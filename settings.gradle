pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        def localSdkRepo = providers.gradleProperty("smkitLocalRepo")
            .orElse(providers.environmentVariable("SMKIT_LOCAL_REPO"))
        if (localSdkRepo.isPresent()) {
            exclusiveContent {
                forRepository { maven { url uri(localSdkRepo.get()) } }
                filter {
                    includeGroupByRegex 'com\\.sency.*'
                    includeVersion 'androidx.camera', 'camera-core', '1.1.0.1-sency16kb'
                }
            }
        }
        maven {
            url "https://artifacts.sency.ai/artifactory/release"
        }
    }
}

rootProject.name = "SMKitDemoApp"
include ':app'
